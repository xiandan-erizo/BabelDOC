<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务 · BabelDOC</title>
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M9 8h14v6a7 7 0 0 1-7 7 7 7 0 0 1-7-7z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M12 23h12M15 27h8' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">
          <span class="brand__logo">
            <svg width="17" height="17" viewBox="0 0 32 32" fill="none">
              <path d="M9 8h14v6a7 7 0 0 1-7 7 7 7 0 0 1-7-7z" stroke="#fff" stroke-width="2.4"/>
              <path d="M12 23h12M15 27h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </span>
          BabelDOC 翻译
        </a>
        <nav class="nav">
          <a href="/">翻译</a>
          <a href="/history.html" class="is-active">任务</a>
          <a href="/settings.html">设置</a>
        </nav>
      </div>
    </header>

    <main class="main" style="max-width: 1000px">
      <section class="card">
        <div class="meta-line" style="justify-content: space-between; margin-bottom: 14px">
          <div>
            <h1 class="card__title" style="margin-bottom: 2px">任务记录</h1>
            <span class="kv">最近任务的状态、进度与下载</span>
          </div>
          <div class="meta-line">
            <select class="select" id="limit" style="width: auto">
              <option value="20">最近 20 条</option>
              <option value="50">最近 50 条</option>
              <option value="100">最近 100 条</option>
              <option value="200">最近 200 条</option>
            </select>
            <label class="check" style="white-space: nowrap">
              <input type="checkbox" id="auto" checked /> 自动刷新
            </label>
            <button class="btn btn--sm" id="refreshBtn" type="button">↻ 刷新</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table" id="table">
            <thead>
              <tr>
                <th>时间</th>
                <th>文件</th>
                <th>语言</th>
                <th>模型</th>
                <th>状态</th>
                <th style="width: 130px">进度</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="empty" class="empty" style="display: none">
            <div class="empty__icon">📭</div>
            还没有任务，去 <a href="/">提交一个</a> 吧
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      运行中的任务由独立进程处理 · 完成后自动释放内存
    </footer>

    <script src="/assets/app.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let timer = null;

      async function load() {
        let jobs;
        try {
          jobs = await api(`/api/jobs?limit=${$("limit").value}`);
        } catch (e) {
          toast(e.message, "err");
          return;
        }
        const empty = $("empty");
        const tbody = $("tbody");
        empty.style.display = jobs.length ? "none" : "block";
        $("table").style.display = jobs.length ? "table" : "none";

        tbody.innerHTML = jobs
          .map((j) => {
            const st = statusMeta(j.status);
            const pct = Math.round(j.progress || 0);
            const si = stageInfo(j.stage);
            const name = j.file_name || j.job_id.slice(0, 10) + "…";
            const progress =
              j.status === "running"
                ? `<div class="meta-line" style="gap:8px"><div class="progress" style="flex:1"><div class="progress__bar" style="width:${pct}%"></div></div><span class="progress__num">${pct}%</span></div>`
                : j.status === "queued"
                ? `<span class="kv">等待中</span>`
                : j.status === "finished"
                ? `<span class="kv" style="color:var(--success)">✓ 100%</span>`
                : `<span class="kv">—</span>`;

            let actions = "";
            if (j.status === "finished" && j.results) {
              const items = [];
              if (j.results.dual) items.push(`<a href="${downloadUrl(j.job_id, "dual")}" title="双语 PDF">双语</a>`);
              if (j.results.mono) items.push(`<a href="${downloadUrl(j.job_id, "mono")}" title="单语 PDF">单语</a>`);
              if (j.results.dual_no_wm) items.push(`<a href="${downloadUrl(j.job_id, "dual_no_wm")}" title="无水印双语">无水双语</a>`);
              if (j.results.mono_no_wm) items.push(`<a href="${downloadUrl(j.job_id, "mono_no_wm")}" title="无水印单语">无水单语</a>`);
              if (j.results.glossary) items.push(`<a href="${downloadUrl(j.job_id, "glossary")}" title="术语表 CSV">术语</a>`);
              actions = `<span style="display:inline-flex;gap:7px;font-size:12.5px">${items.join("")}</span>`;
            } else if (j.status === "error") {
              actions = `<button class="btn btn--sm" data-retry="${escapeHtml(
                j.job_id
              )}" type="button" title="用原文件和原参数重新翻译">↻ 重新提交</button>
              <span class="kv" title="${escapeHtml(j.error || "")}">失败原因</span>`;
            }
            const canDelete = j.status !== "running";
            actions += ` ${
              canDelete
                ? `<button class="btn btn--danger btn--sm" data-del="${escapeHtml(
                    j.job_id
                  )}" type="button">删除</button>`
                : ""
            }`;

            return `
              <tr>
                <td class="mono" style="white-space:nowrap; font-size:12px; color:var(--muted)">${fmtDateTime(j.created_at)}</td>
                <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${escapeHtml(j.file_name || "")}">${escapeHtml(name)}</td>
                <td style="white-space:nowrap">${(j.lang_in || "").toUpperCase()} → ${(j.lang_out || "").toUpperCase()}</td>
                <td style="white-space:nowrap">${escapeHtml(j.model || "—")}</td>
                <td>
                  <span class="badge ${st.cls}">${st.label}</span>
                  ${
                    j.status === "running" && si
                      ? `<div class="kv" style="font-size:11.5px; margin-top:2px">${escapeHtml(si.label)}</div>`
                      : ""
                  }
                </td>
                <td>${progress}</td>
                <td style="white-space:nowrap">${actions}</td>
              </tr>`;
          })
          .join("");

        // wire up delete + retry buttons
        tbody.querySelectorAll("[data-del]").forEach((btn) =>
          btn.addEventListener("click", () => removeJob(btn.dataset.del))
        );
        tbody.querySelectorAll("[data-retry]").forEach((btn) =>
          btn.addEventListener("click", () => retryJob(btn.dataset.retry))
        );
      }

      async function retryJob(jobId) {
        try {
          await api(`/api/jobs/${jobId}/retry`, { method: "POST" });
          toast("已重新提交", "ok");
          load();
        } catch (e) {
          toast(e.message, "err");
        }
      }

      async function removeJob(jobId) {
        if (!confirm("删除该任务记录及其输出文件？")) return;
        try {
          await api(`/api/jobs/${jobId}`, { method: "DELETE" });
          toast("已删除", "ok");
          load();
        } catch (e) {
          toast(e.message, "err");
        }
      }

      function schedule() {
        if (timer) clearInterval(timer);
        if ($("auto").checked) timer = setInterval(load, 5000);
      }

      $("refreshBtn").addEventListener("click", load);
      $("limit").addEventListener("change", load);
      $("auto").addEventListener("change", schedule);

      load();
      schedule();
    </script>
  </body>
</html>
